<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <link
      rel="icon"
      href="/brand/favicon.ico"
      sizes="16x16 32x32 48x48"
    />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="NeoPhylo" />
    <meta
      property="og:description"
      content="Learn how phylogenetic trees are built, step by step"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/og-image.png" />
    <title>NeoPhylo</title>
    <script>
      // v1.3 spec §3.3: data-theme on <html> before first paint — light
      // by default regardless of prefers-color-scheme, with the
      // device-local neophylo.theme pref overriding. Storage can be
      // blocked; swallow and stay light. design/theme.ts keeps the same
      // fallback for the session-side read.
      try {
        document.documentElement.dataset.theme =
          window.localStorage.getItem("neophylo.theme") === "dark"
            ? "dark"
            : "light";
        // §6.6: data-presenter too, so a stored presenter session
        // never paints at 1× before rescaling.
        if (window.localStorage.getItem("neophylo.presenter") === "1")
          document.documentElement.dataset.presenter = "true";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script>
      // Register the service worker at parse time rather than on window
      // 'load' so install+precache starts as early as possible. In dev
      // /sw.js is a 404 — swallow the rejection there. 'sw.js'/'./' are
      // relative so the NEOPHYLO_BASE deploy scope keeps working.
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
