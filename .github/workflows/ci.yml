# CI — the GitHub-side twin of scripts/check.sh. Every job delegates to a
# scripts/ci/*.sh step so local and CI runs are identical; the YAML only
# installs the toolchain each script assumes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR-only: existing fixtures may not change in the same commit as code.
  fixture-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fixture guard
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/fixture-guard.sh

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        # rustup reads rust-toolchain.toml: stable + clippy/rustfmt +
        # wasm32-unknown-unknown.
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fmt + clippy + tests
        run: scripts/ci/rust.sh

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.15.0
      - name: Install wasm-pack v0.15.0
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          tar xzf wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          install -D -m 0755 wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack "$HOME/.cargo/bin/wasm-pack"
      - name: wasm parity tests + build + generated-types diff + bundle size
        run: scripts/ci/wasm.sh
      - name: Upload wasm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-pkg
          path: |
            web/src/engine/pkg
            web/src/engine/generated
          retention-days: 1

  web:
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download wasm package
        # The artifact's root is the LCA of its upload paths
        # (web/src/engine), so extract into it to restore pkg/ and
        # generated/ where the checkout expects them.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: web/src/engine
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: lint + unit tests + build
        run: scripts/ci/web.sh
      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: web/dist
          retention-days: 1

  e2e:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download wasm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: web/src/engine
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        # Playwright + the dev/preview servers need node_modules; test
        # selection itself stays in scripts/ci/e2e.sh.
        working-directory: web
        run: npm ci
      - name: Playwright version
        id: playwright-version
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}
      - name: Install ${{ matrix.browser }}
        working-directory: web
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: E2E (${{ matrix.browser }})
        env:
          E2E: "1"
        run: scripts/ci/e2e.sh --project=${{ matrix.browser }} --reporter=list,html
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # Rebuilds the reference fixtures and fails on any drift — a version or
  # locale difference must be judged by a human; CI never commits fixtures.
  r-and-fixtures:
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: |
            ape
            phangorn
            jsonlite
      - name: Install PHYLIP
        run: |
          sudo apt-get update
          sudo apt-get install -y phylip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download wasm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: web/src/engine
      - name: Regenerate fixtures and diff against committed ref/
        # FIXTURES=1 reruns generate.R + generate_phylip.sh, then
        # git diff --exit-code fixtures/ref (plus an untracked-file check).
        env:
          FIXTURES: "1"
        run: scripts/ci/fixture-guard.sh
      - name: R export parity
        env:
          RPARITY: "1"
        run: scripts/ci/r-parity.sh

  # Deploys the web job's `dist` artifact to Netlify (task: ci/netlify-deploy).
  # Preview deploys for same-repo PRs only — fork PRs are excluded below so
  # they never see the Netlify secrets (and pull_request_target is never
  # used). Pushes to main deploy production.
  deploy:
    # fixture-guard only runs on pull_request (its own `if`), so its result
    # is "skipped" on push. A plain `needs` list would then skip this job;
    # always() + !failure()/!cancelled() keeps the gate on every job that
    # actually ran while tolerating fixture-guard's intentional skip.
    needs: [rust, wasm, web, e2e, r-and-fixtures, fixture-guard]
    if: >-
      always() && !failure() && !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      # checkout only supplies .nvmrc to setup-node — the deploy itself
      # works purely off the `dist` artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: web/dist
      - name: Deploy preview to Netlify
        id: netlify
        if: github.event_name == 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # netlify-cli's bins are `netlify`/`ntl` — npx needs --package to
        # resolve them (the bare `npx netlify-cli@ver deploy` form errors).
        run: |
          npx --yes --package netlify-cli@27.13.0 netlify deploy \
            --dir web/dist \
            --alias "pr-${{ github.event.number }}" \
            --json > netlify-deploy.json
          url=$(node -p "require('./netlify-deploy.json').deploy_url")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.netlify.outputs.url }}
        with:
          script: |
            const marker = "<!-- neophylo-netlify-preview -->";
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.login === "github-actions[bot]" && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Deploy production to Netlify
        if: github.event_name == 'push'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes --package netlify-cli@27.13.0 netlify deploy --prod --dir web/dist
