# CI — the GitHub-side twin of scripts/check.sh. Every job delegates to a
# scripts/ci/*.sh step so local and CI runs are identical; the YAML only
# installs the toolchain each script assumes.
#
# Feedback tiers (ci/speed): PRs take a fast path — the `changes` job
# path-filters heavy jobs (a skipped required check counts as passing),
# e2e runs Chromium only, sharded in two, without @perf — plus Firefox
# when the PR touches rendering paths (the `render` filter). Every non-PR
# event — main pushes, v*.*.* tags, the nightly cron, and a manual
# workflow_dispatch on any branch ("run the full matrix on this PR's
# branch") — sets `full`, so every job runs: all three browsers, @perf,
# R parity and the fuzz build. Branch pushes outside main don't trigger
# at all; a PR's checks cover them.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # nightly full matrix
  workflow_dispatch:       # dispatch on any branch to run the full matrix

permissions:
  contents: read

concurrency:
  # Superseded PR/branch runs are cancelled; main and tag runs never are —
  # a release gate that cancels would let a stale run's deploy land.
  group: ci-${{ github.ref }}
  cancel-in-progress: >-
    ${{
      github.ref != 'refs/heads/main' &&
      !startsWith(github.ref, 'refs/tags/')
    }}

jobs:
  # Path gate. `full` short-circuits every filter on non-PR events so the
  # complete matrix always runs there; on PRs the filters decide which
  # heavy jobs run at all (skipped jobs report a passing conclusion).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read   # paths-filter lists PR files via the API
    outputs:
      full: ${{ steps.full.outputs.full }}
      webapp: ${{ steps.filter.outputs.webapp }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      visual: ${{ steps.filter.outputs.visual }}
      render: ${{ steps.filter.outputs.render }}
      e2e-browsers: ${{ steps.e2e.outputs.browsers }}
    steps:
      - name: Full-matrix flag
        id: full
        run: echo "full=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"
      - name: Changed paths (PRs only)
        id: filter
        if: steps.full.outputs.full != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # webapp gates wasm/web/licenses/e2e. wasm also runs when
          # `fixtures` matches because r-and-fixtures needs its artifact.
          filters: |
            webapp:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'web/**'
              - 'scripts/**'
              - 'about.toml'
              - 'about.hbs'
              - '.github/workflows/ci.yml'
            fixtures:
              - 'fixtures/**'
              - 'crates/**'
              - 'web/src/export/**'
              - 'scripts/ci/r-parity.sh'
              # the parity logic itself lives here; must gate r-and-fixtures
              - 'web/scripts/r-parity.mjs'
              - 'scripts/ci/fixture-guard.sh'
              - 'scripts/compare/**'
              - 'docker/ci-r/**'
              - '.github/workflows/ci.yml'
            fuzz:
              - 'crates/**'
            # spec §8.3: the visual snapshot job runs on PRs touching
            # web/** (plus the workflow itself and its runner script).
            visual:
              - 'web/**'
              - 'scripts/ci/visual.sh'
              - '.github/workflows/ci.yml'
            # Rendering changes add Firefox to the PR's e2e matrix — the
            # support-label regression (Firefox's float32 getBBox vs the
            # drawn 10 px bound) shipped through a Chromium-only matrix.
            render:
              - 'web/src/views/**'
              - 'web/src/layout/**'
              - 'web/src/export/**'
              - 'web/src/design/**'
              - 'web/src/measureText.ts'
              - 'web/src/index.css'
              - 'web/index.html'
              - 'web/playwright.config.ts'
              - 'web/public/fonts/**'
              - 'web/e2e/**'
              - '.github/workflows/ci.yml'
      - name: E2E browser matrix
        id: e2e
        run: |
          if [ "${{ steps.full.outputs.full }}" = "true" ]; then
            browsers='["chromium","firefox","webkit"]'
          elif [ "${{ steps.filter.outputs.render }}" = "true" ]; then
            browsers='["chromium","firefox"]'
          else
            browsers='["chromium"]'
          fi
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"

  # PR-only: existing fixtures may not change in the same commit as code.
  fixture-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fixture guard
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/fixture-guard.sh

  # Always runs — it is cheap (~40 s) and stays a stable required check
  # even on docs-only PRs.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        # rustup reads rust-toolchain.toml: stable + clippy/rustfmt +
        # wasm32-unknown-unknown.
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache cargo-nextest
        id: cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-0.9.149
      - name: Install cargo-nextest v0.9.149
        if: steps.cargo-nextest.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo nextest.tar.gz https://get.nexte.st/0.9.149/linux
          echo "32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770  nextest.tar.gz" | sha256sum -c -
          tar xzf nextest.tar.gz cargo-nextest
          install -D -m 0755 cargo-nextest "$HOME/.cargo/bin/cargo-nextest"
      - name: fmt + clippy + tests
        run: scripts/ci/rust.sh

  wasm:
    needs: changes
    if: >-
      needs.changes.outputs.webapp == 'true' ||
      needs.changes.outputs.fixtures == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.15.0
      - name: Install wasm-pack v0.15.0
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          tar xzf wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          install -D -m 0755 wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack "$HOME/.cargo/bin/wasm-pack"
      - name: Cache built wasm package
        # Reused when crates/** + Cargo.lock + the build script are
        # unchanged; wasm.sh then skips the rebuild but still runs the
        # parity tests, generated-types diff and bundle-size check.
        id: wasm-pkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/src/engine/pkg
            web/src/engine/generated
          key: >-
            ${{ runner.os }}-wasm-pkg-${{
              hashFiles('crates/**', 'Cargo.lock', 'scripts/build-wasm.sh') }}
      - name: wasm parity tests + build + generated-types diff + bundle size
        env:
          WASM_PKG_HIT: ${{ steps.wasm-pkg.outputs.cache-hit }}
        run: scripts/ci/wasm.sh
      - name: Upload wasm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-pkg
          path: |
            web/src/engine/pkg
            web/src/engine/generated
          retention-days: 1

  # The fuzz crate is a standalone workspace (fuzz/Cargo.toml declares its
  # own [workspace]), so a broken fuzz target never fails the main build —
  # this job compiles every target on each push/PR to catch API drift (e.g.
  # exercise schema v2) that the nightly run would otherwise report late.
  fuzz-build:
    needs: changes
    if: >-
      needs.changes.outputs.fuzz == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz
      - name: Build all fuzz targets
        # cargo-fuzz has no --manifest-path support; run inside the fuzz dir.
        working-directory: crates/neophylo-core/fuzz
        run: cargo +nightly fuzz build

  # License gate for the shipped app (docs/release-1.1 §C): cargo-about
  # scans every crate compiled into the wasm against about.toml's
  # accepted list — anything else fails here. The rendered crate notices
  # go to the web job as an artifact so the build can fold them into
  # licenses.html without installing cargo-about there. The npm side of
  # the same gate runs inside `vite build` (web/scripts/licenses.ts).
  licenses:
    needs: changes
    if: >-
      needs.changes.outputs.webapp == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache cargo-about
        id: cargo-about
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          key: ${{ runner.os }}-cargo-about-0.9.2
      - name: Install cargo-about v0.9.2
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Dependency license gate + render Rust notices
        run: scripts/ci/licenses.sh
      - name: Upload Rust notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-licenses
          path: web/.licenses/rust-licenses.html
          retention-days: 1

  web:
    needs: [changes, wasm, licenses]
    if: >-
      needs.changes.outputs.webapp == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download wasm package
        # The artifact's root is the LCA of its upload paths
        # (web/src/engine), so extract into it to restore pkg/ and
        # generated/ where the checkout expects them.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: web/src/engine
      - name: Download Rust license notices
        # Rendered by the licenses job's `cargo about generate`; the
        # build folds it into licenses.html (web/scripts/licenses.ts).
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-licenses
          path: web/.licenses
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: lint + unit tests + build
        run: scripts/ci/web.sh
      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: web/dist
          retention-days: 1

  # PR fast path: Chromium only — plus Firefox when the `render` filter
  # matched — two shards, no @perf: a fraction of the old e2e wall time.
  # Full events shard all three browsers in two and run @perf inside
  # each shard (E2E_PERF defaults to 1).
  e2e:
    needs: [changes, web]
    if: >-
      needs.changes.outputs.webapp == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Browsers, their system libraries, and Node 24 are baked into the
      # image — no per-run playwright install or apt. The tag must equal
      # the locked @playwright/test version (browser builds are keyed to
      # it); scripts/ci/check-playwright-image.sh enforces that and the
      # digest pin. bump-ci-image.yml opens the version/digest bump PR.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host # Chromium's shared-memory requirement
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.changes.outputs.e2e-browsers) }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust workspace for git
        # Same container-ownership issue as r-and-fixtures: the container
        # runs as root while the mounted checkout is owned by the host uid.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download wasm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: web/src/engine
      - name: Playwright image pin check
        # Fails fast if the image version drifted from @playwright/test or
        # either container image lost its digest pin.
        run: scripts/ci/check-playwright-image.sh
      - name: Cache npm
        # setup-node's npm cache, kept now that the image provides Node.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-e2e-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-e2e-
      - name: Install web dependencies
        # Playwright + the dev/preview servers need node_modules; test
        # selection itself stays in scripts/ci/e2e.sh. Browsers come from
        # PLAYWRIGHT_BROWSERS_PATH=/ms-playwright baked into the image.
        working-directory: web
        run: npm ci
      - name: E2E (${{ matrix.browser }} shard ${{ matrix.shard }}/2)
        env:
          E2E: "1"
          E2E_PERF: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          # The container runs as root but GitHub mounts HOME=/github/home
          # owned by the image's pwuser — Firefox exits immediately on a
          # $HOME it doesn't own (Playwright's own banner prescribes this).
          HOME: /root
        run: >-
          scripts/ci/e2e.sh --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}/2 --reporter=list,html
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # Visual snapshot matrix (v1.3 Task 5, spec §8.3): the `visual`
  # Playwright project — Chromium only, every scene × viewport × theme
  # against the owner-approved baselines in web/e2e/__screenshots__/.
  # On failure the actual/diff images upload as an artifact and a PR
  # comment links them; baseline changes themselves need owner approval.
  visual:
    needs: [changes, wasm]
    if: >-
      needs.changes.outputs.visual == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read          # lists the run's artifacts for the diff link
      contents: read
      pull-requests: write   # posts the diff-images comment on failure
    container:
      # Same pinned image as the e2e job — baselines are only stable if
      # the renderer is (check-playwright-image.sh enforces the pin).
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host # Chromium's shared-memory requirement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download wasm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: web/src/engine
      - name: Playwright image pin check
        run: scripts/ci/check-playwright-image.sh
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-e2e-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-e2e-
      - name: Install web dependencies
        # Browsers come from PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
        # baked into the image.
        working-directory: web
        run: npm ci
      - name: Visual snapshots
        env:
          HOME: /root
        run: scripts/ci/visual.sh
      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: web/test-results/
          retention-days: 7
      - name: Link the diff artifact on the PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = "<!-- neophylo-visual-diffs -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let link = `${runUrl}#artifacts`;
            try {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              const diff = artifacts.data.artifacts.find(
                (a) => a.name === "visual-diffs",
              );
              if (diff) {
                link = `${runUrl}/artifacts/${diff.id}`;
              }
            } catch {
              // The comment still posts with the run-page fallback link.
            }
            const body =
              `${marker}\nThe \`visual\` job found snapshot diffs. ` +
              `Download the **visual-diffs** artifact for the actual and ` +
              `diff images: ${link}\n\n` +
              `If the change is intended, regenerate the baselines ` +
              `(\`npx playwright test e2e/visual.spec.ts ` +
              `--update-snapshots --project=visual\`) — baseline changes ` +
              `need owner approval.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.login === "github-actions[bot]" && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Rebuilds the reference fixtures and fails on any drift — a version or
  # locale difference must be judged by a human; CI never commits fixtures.
  # Runs in the pinned R + PHYLIP image from docker/ci-r (published by
  # publish-ci-r.yml) instead of reinstalling the stack every run.
  r-and-fixtures:
    needs: [changes, wasm]
    if: >-
      needs.changes.outputs.fixtures == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Digest-pinned: publish-ci-r.yml opens a bump PR on every rebuild so a
    # re-pushed :1 tag can only land through CI + review. Bump the tag here
    # and in the publish workflow together on a breaking toolchain change.
    container: ghcr.io/dorrabbkhan/neophylo-ci-r:1@sha256:f7618b634c17764f793cb7eeca87688033e6e5d81ca887cfd8b69153e8ff3a78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download wasm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: web/src/engine
      - name: Trust workspace for git
        # actions/checkout writes safe.directory into a temporary HOME
        # that does not persist to run steps; the container runs as root
        # while the mounted checkout is owned by the host uid, so every
        # later git call would die with "detected dubious ownership".
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Regenerate fixtures and diff against committed ref/
        # FIXTURES=1 reruns generate.R + generate_phylip.sh, then
        # git diff --exit-code fixtures/ref (plus an untracked-file check).
        env:
          FIXTURES: "1"
        run: scripts/ci/fixture-guard.sh
      - name: R export parity
        env:
          RPARITY: "1"
        run: scripts/ci/r-parity.sh

  # Deploys the web job's `dist` artifact to Netlify (task: ci/netlify-deploy).
  # Preview deploys for same-repo PRs only — fork PRs are excluded below so
  # they never see the Netlify secrets (and pull_request_target is never
  # used). Pushes to main deploy a free `main` alias (staging); production
  # deploys only on v*.*.* tags or a manual run from main — Netlify charges
  # credits per production deploy, so it is never triggered by a plain push.
  # Release safety: `needs` includes the full-matrix jobs (e2e runs all
  # browsers + @perf on tags, plus r-and-fixtures and fuzz-build), so a
  # production deploy cannot land unless the full matrix passed for that
  # tagged commit.
  deploy:
    # fixture-guard only runs on pull_request (its own `if`), so its result
    # is "skipped" on push. A plain `needs` list would then skip this job;
    # always() + !failure()/!cancelled() keeps the gate on every job that
    # actually ran while tolerating fixture-guard's intentional skip.
    needs: [changes, rust, wasm, web, e2e, visual, r-and-fixtures, fixture-guard, fuzz-build, licenses]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.changes.outputs.webapp == 'true' || needs.changes.outputs.full == 'true') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment: >-
      ${{
        (startsWith(github.ref, 'refs/tags/v') ||
         (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        && 'production'
        || (github.event_name == 'pull_request' && 'preview' || 'staging')
      }}
    steps:
      # checkout only supplies .nvmrc to setup-node — the deploy itself
      # works purely off the `dist` artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: web/dist
      - name: Deploy preview to Netlify
        id: netlify
        if: github.event_name == 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # netlify-cli's bins are `netlify`/`ntl` — npx needs --package to
        # resolve them (the bare `npx netlify-cli@ver deploy` form errors).
        run: |
          npx --yes --package netlify-cli@27.13.0 netlify deploy \
            --dir web/dist \
            --alias "pr-${{ github.event.number }}" \
            --json > netlify-deploy.json
          url=$(node -p "require('./netlify-deploy.json').deploy_url")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.netlify.outputs.url }}
        with:
          script: |
            const marker = "<!-- neophylo-netlify-preview -->";
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.login === "github-actions[bot]" && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Deploy staging to Netlify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # --alias main is a free deploy; the stable URL is
        # main--<site>.netlify.app. No PR comment — the URL goes to the
        # job summary instead.
        run: |
          npx --yes --package netlify-cli@27.13.0 netlify deploy \
            --dir web/dist \
            --alias main \
            --json > netlify-deploy.json
          url=$(node -p "require('./netlify-deploy.json').deploy_url")
          echo "Staging URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Staging URL: $url"
      - name: Deploy production to Netlify
        # Only on a v*.*.* tag push or a manual run dispatched from main.
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes --package netlify-cli@27.13.0 netlify deploy --prod --dir web/dist
