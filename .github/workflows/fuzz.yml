name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FUZZ: "1"
  FUZZ_SECONDS: "300"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo-fuzz
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz

      # Build is a separate step so a compile failure (e.g. engine API drift
      # in the standalone fuzz workspace) is reported with its own issue
      # title instead of looking like a crash.
      - name: Build fuzz targets
        id: build
        working-directory: crates/neophylo-core/fuzz
        run: cargo +nightly fuzz build

      - name: Run fuzz smoke (${{ env.FUZZ_SECONDS }} s per target)
        run: bash scripts/ci/fuzz.sh

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: crates/neophylo-core/fuzz/artifacts
          if-no-files-found: ignore

      - name: File or update fuzz-crash issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          gh label create fuzz-crash --description "Automated fuzz crash report" --force
          if [ "$BUILD_OUTCOME" = "failure" ]; then
            TITLE="Nightly fuzz build failed"
            BODY="The nightly fuzz targets failed to build — likely engine API drift in the standalone fuzz workspace. Run: $RUN_URL"
          else
            TITLE="Fuzz crash detected in nightly run"
            BODY="Fuzzing failed. Run: $RUN_URL

          Crash artifacts (if any) are attached to the workflow run."
          fi
          ISSUE=$(gh issue list --label fuzz-crash --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$TITLE: $RUN_URL"
          else
            gh issue create \
              --title "$TITLE" \
              --label fuzz-crash \
              --body "$BODY"
          fi
