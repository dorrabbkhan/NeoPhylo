name: Bug report
description: Report something that is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps to reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL from your address bar
      description: Paste the state link — it encodes your session and helps us reproduce the bug.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 131 on Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop an image here if it helps.
    validations:
      required: false
